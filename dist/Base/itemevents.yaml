      - SetCharacterInvincibility(X8_4, Enabled)
      - SetCharacterInvincibility(X12_4, Enabled)
    # Don't let Anri get killed by Horace
    - Match: IfEventFlag(AND_04, ON, TargetEventFlagType.EventFlag, 1497)
      Condition: false
    # Allow Anri to move to the church even if they know where Horace is
    - Match: IfEventFlag(AND_06, OFF, TargetEventFlagType.EventFlag, 73800102)
      Remove: true

  # Anri logic #2
  - ID: 13805703
    If: safequest
    Edits:
    # Same edits as above
    - Match: IfEventFlag(AND_05, OFF, TargetEventFlagType.EventFlag, 1498)
      Condition: false
    - Match: IfEventFlag(AND_07, OFF, TargetEventFlagType.EventFlag, 73800102)
      Remove: true

  # Yuria logic
  - ID: 13805707
    If: safequest
    Edits:
    # Disable various events that fail Yuria's quest. These shouldn't be triggerable, but just in
    # case.
    - Match: IfPlayerRemainingYoelLevelCount(AND_05, ComparisonType.Greater, 0)
      Condition: false
    - Match: IfEventFlag(AND_06, ON, TargetEventFlagType.EventFlag, 1358)
      Condition: false
    - Match: IfEventFlag(AND_07, ON, TargetEventFlagType.EventFlag, 1578)
      Condition: false
    - Match: IfEventFlag(AND_08, ON, TargetEventFlagType.EventFlag, 1043)
      Condition: false

  m39_00_00_00: # Irithyll Dungeon / Profaned Capitol
  - ID: 0
    If: safequest  
    Edits:
    # Remove the events that make Karla die or aggro.
    - Match: {Init: {Callee: 20006002}, Arguments: [3900700]}
      Remove: true
    # Same with Siegward
    - Match: {Init: {Callee: 20006002}, Arguments: [null, 1398]}
      Repeat: -1
      Remove: true
    - Match: {Init: {Callee: 20006000}, Arguments: [3900705]}
      Remove: true
    - Match: {Init: {Callee: 20006001}, Arguments: [3900705]}
      Remove: true

  - ID: 13900729
    If: safequest
    Edits:
    # It's unclear why, but this event can also bring Siegward into the dungeon.
    - Match: {Name: IfEventFlag, Arguments: [null, null, null, 73500105]}
      Set: [{Param: targetEventFlagId, Value: 50006211}]

  # Siegward logic
  - ID: 13905720
    If: safequest
    Edits:
    # Make Siegward invincible
    - AddBefore:
      - SetCharacterInvincibility(X0_4, Enabled)
      - SetCharacterInvincibility(X4_4, Enabled)
    # Don't let Siegward show up in the dungeon until he's given Siegbräu in Irithyll
    - Match: {Name: IfEventFlag, Arguments: [null, null, null, 73500105]}
      Set: [{Param: targetEventFlagId, Value: 50006211}]

  # Prevent Storm Ruler infinite shiny from appearing, since it's randomized elsewhere
  - ID: 13905870
    Edits:
    - Match: "SetObjectTreasureState(X0_4, Disabled)"
      AddAfter: ["EndUnconditionally(EventEndType.End)"]

  m40_00_00_00: # Firelink
  - ID: 0
    If: safequest
    Edits:
    # Remove the events that make Greirat die or aggro. These shouldn't trigger because he's
    # invincible, but just in case.
    - Match: {Init: {Callee: 20006002}, Arguments: [4000720]}
      Remove: true
    - Match: {Init: {Callee: 20006000}, Arguments: [4000720]}
      Remove: true
    - Match: {Init: {Callee: 20006001}, Arguments: [4000720]}
      Remove: true
    # Same with Yoel
    - Match: {Init: {Callee: 20006002}, Arguments: [null, 1078]}
      Remove: true
    # Same with Anri and Horace
    - Match: {Init: {Callee: 20006001}, Arguments: [null, 1356]} # Anri attacked
      Repeat: -1
      Remove: true
    - Match: {Init: {Callee: 20006002}, Arguments: [null, 1358]} # Anri dead
      Repeat: -1
      Remove: true
    - Match: {Init: {Callee: 20006001}, Arguments: [null, 1496]} # Horace attacked
      Remove: true
    - Match: {Init: {Callee: 20006002}, Arguments: [null, 1498]} # Horace dead
      Remove: true
    - Match: {Init: {Callee: 14005581}} # Anri and Horace hostile
      Repeat: -1
      Remove: true
    - Match: {Init: {Callee: 14000583}} # Anri hostile because Horace is dead
      Repeat: -1
      Remove: true
    - Match: {Init: {Callee: 14000585}} # Horace hostile because Anri is dead
      Repeat: -1
      Remove: true
    - Match: {Init: {Callee: 14005587}} # Despairing Anri dead
      Repeat: -1
      Remove: true

  # Patches betrayal
  - ID: 14000621
    If: safequest
    Edits:
    # Rather than allowing Patches to show up at the bell tower under a variety of circumstances,
    # only let him show up once he's given the player the rusted coin. (This is guaranteed to
    # be possible because we disable the option to say you don't know who he is.)
    - Match: IfConditionGroup(AND_01, PASS, OR_01)
      Replace: ["IfEventFlag(AND_01, ON, TargetEventFlagType.EventFlag, 50006200)"]

  - ID: 14005501
    Name: countOrbeckSpells
    Edits:
    # This event contains conditions for every spell, but those outside the default shop items and
    # Sage's Scroll are in the unused AND_01 condition group. Put them in OR_01 instead so that
    # players don't have to try to track which specific items they buy from Orbeck.
    - Match: {Name: IfEventFlag, Arguments: [AND_01, "ON"]}
      Repeat: -1
      Set:
      - {Param: {Index: 0}, Value: OR_01}
      - {Param: {Index: 1}, Value: CHANGE}

  # Yuria logic
  - ID: 14005520
    If: safequest
    Edits:
    # Disable various events that fail Yuria's quest. These shouldn't be triggerable, but just in
    # case.
    - Match: IfPlayerRemainingYoelLevelCount(AND_05, ComparisonType.Greater, 0)
      Condition: false
    - Match: IfEventFlag(AND_06, ON, TargetEventFlagType.EventFlag, 1358)
      Condition: false
    - Match: IfEventFlag(AND_07, ON, TargetEventFlagType.EventFlag, 1578)
      Condition: false
    - Match: IfEventFlag(AND_08, ON, TargetEventFlagType.EventFlag, 1043)
      Condition: false

  # Yoel logic
  - ID: 14005740
    If: safequest
    Edits:
    # Make Yoel invincible
    - AddBefore: ["SetCharacterInvincibility(X0_4, Enabled)"]
    # Don't let Yoel die if you go to Irithyll before talking to him
    - Match: IfEventFlag(AND_04, ON, TargetEventFlagType.EventFlag, 138)
      Condition: false
    - Match: IfEventFlag(AND_05, ON, TargetEventFlagType.EventFlag, 138)
      Condition: false

  # Greirat logic
  - ID: 14005700
    If: safequest
    Edits:
    # Prevent the player from killing Greirat
    - AddBefore: ["SetCharacterInvincibility(X0_4, Enabled)"]
    # Don't die in Irithyll if Siegward/Patches haven't saved him by making the check condition
    # always fail.
    - Match: "IfEventFlag(AND_05, OFF, TargetEventFlagType.EventFlag, 1385)"
      Condition: false
    # Don't allow Siegward to rescue Greirat from Irithyll. This, combined with the above,
    # guarantees that Greirat only returns when Patches rescues him. (We also modify Greirat's
    # dialogue so he doesn't suggest raiding Irithyll until Patches is in Firelink.)
    - Match: "IfEventFlag(OR_01, ON, TargetEventFlagType.EventFlag, 1385)"
      Condition: true

  m45_00_00_00: # Painted World of Ariandel
  - ID: 14505181
    If: phantomhunters
    # Detect the Phantom Hunters covenant instead of ember status
    - Match: IfCharacterHasSpEffect(AND_01, 10000, 490, true, ComparisonType.Equal, 1)
      Replace: ["IfPlayersCovenant(AND_01, 10)"]

Initialize:
  m40_00_00_00: # Firelink
  # Trigger a custom event when Orbeck sells seven scrolls. We use this as the
  # new trigger for giving the Slumbering Dragoncrest Ring lot, so the player
  # doesn't have to guess which of the four spells trigger it.
  - Name: countOrbeckSpells
    Arguments: [74000800, 74000801, 4, 4, 4]
